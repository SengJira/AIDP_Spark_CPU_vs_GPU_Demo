# GPU run — common.conf plus the RAPIDS keys below. Same code, same
# executor shape; only configuration differs.

spark.demo.mode=gpu

# --- NVIDIA Spark RAPIDS ---
# The RAPIDS plugin jar is pre-staged in the DPE GPU image at
# /opt/spark/gpu/jars/rapids-4-spark.jar (verified: v25.12.0, Spark 3.5.7).
spark.plugins=com.nvidia.spark.SQLPlugin
spark.rapids.sql.enabled=true
spark.driver.resource.gpu.amount=0
spark.executor.resource.gpu.amount=1
spark.task.resource.gpu.amount=0.25
spark.rapids.sql.concurrentGpuTasks=2
spark.rapids.memory.pinnedPool.size=2g
spark.executor.memoryOverhead=4g

# --- Tuning / diagnostics ---
# Cache window results as GPU columnar batches instead of CPU rows.
spark.sql.cache.serializer=com.nvidia.spark.ParquetCachedBatchSerializer
spark.rapids.sql.incompatibleOps.enabled=true
spark.rapids.sql.explain=NOT_ON_GPU
spark.sql.readSideCharPadding=false
spark.sql.legacy.charVarcharAsString=true
