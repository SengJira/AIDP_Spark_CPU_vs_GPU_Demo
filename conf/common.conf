# Shared Spark configuration — applied to BOTH cpu and gpu runs.
# One key=value per line. s3a credentials are injected at submit time
# from environment variables (never stored here).

# --- Identical executor shape for a fair comparison ---
spark.dynamicAllocation.enabled=false
spark.executor.instances=4
spark.executor.cores=4
spark.executor.memory=16g
spark.executor.memoryOverhead=2g
spark.driver.memory=4g
spark.driver.cores=4
spark.sql.shuffle.partitions=200

# --- Adaptive Query Execution ---
spark.sql.adaptive.enabled=true
# Iceberg/Trino interop: Spark writes timestamp[ns] by default on this build;
# Iceberg v2 expects micros.
spark.sql.parquet.outputTimestampType=TIMESTAMP_MICROS

# --- Dell ObjectScale S3A (HTTP, path-style) ---
spark.hadoop.fs.s3a.endpoint=http://172.18.11.31:9020
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.attempts.maximum=10
spark.hadoop.fs.s3a.connection.establish.timeout=30000
spark.hadoop.fs.s3a.connection.timeout=200000
# ObjectScale rejects the zero-byte _SUCCESS marker PUT with
# "BadDigest: Content-MD5 does not match" — skip it entirely.
spark.hadoop.mapreduce.fileoutputcommitter.marksuccessfuljobs=false
